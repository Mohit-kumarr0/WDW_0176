<!DOCTYPE html>
<html>

<head>
    <title>Block and Inline Elements</title>
    <style>
        div {
            background-color: lightblue;
            margin: 5px;
            padding: 2px;
            width: 90%;
        }

        span {
            background-color: lightgreen;
        }
    </style>
</head>

<body>

    <div>Block 1</div>
    <div>Block 2</div>

    <span>Inline 1</span>
    <span>Inline 2</span>
    <span>Inline 3</span>

</body>

</html>
