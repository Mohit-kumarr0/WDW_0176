
<!DOCTYPE html>
<html lang="en">

<head>
    <title>ABC College Admission 2026</title>

    <style>
        body {
            font-family: Arial;
            margin: 20px;
        }

        header {
            background-color: #202878;
            color: white;
            text-align: center;
            padding: 20px;
            width: 80%;
            margin: auto;
        }

        h2 {
            text-align: center;
        }

        table {
            border-collapse: collapse;
            width: 70%;
            margin: auto;
        }

        th, td {
            border: 1px solid #aaa;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #e5e5f0;
            text-align: center;
        }

        caption {
            padding: 8px;
        }

        form {
            width: 70%;
            margin: 15px auto;
        }

        input, select, textarea {
            padding: 5px;
            margin-top: 5px;
        }

        footer {
            background-color: #202878;
            color: white;
            text-align: center;
            padding: 10px;
            width: 80%;
            margin: auto;
        }
    </style>
</head>

<body>

    <header>
        <h1>ABC College Admission 2026</h1>
    </header>

    <main>

        <h2>Courses and Fees</h2>

        <table>

            <caption>Available Courses</caption>

            <thead>
                <tr>
                    <th>Course</th>
                    <th>Seats</th>
                    <th>Fees</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>B.Tech CSE</td>
                    <td>120</td>
                    <td>₹90,000</td>
                </tr>

                <tr>
                    <td>BCA</td>
                    <td>60</td>
                    <td>₹45,000</td>
                </tr>
            </tbody>

        </table>

        <form action="submit.php" method="post">

            <fieldset>

                <legend>Application Form</legend>

                <label for="name">Name:</label>
                <br>
                <input type="text"
                       id="name"
                       name="name"
                       required>

                <br><br>

                <label for="email">Email:</label>
                <br>
                <input type="email"
                       id="email"
                       name="email"
                       required>

                <br><br>

                <label for="course">Course:</label>
                <br>

                <select id="course" name="course">

                    <option value="B.Tech CSE">
                        B.Tech CSE
                    </option>

                    <option value="BCA">
                        BCA
                    </option>

                </select>

                <br><br>

                <label for="statement">Statement:</label>
                <br>

                <textarea id="statement"
                          name="statement"
                          rows="4"
                          cols="40"
                          required></textarea>

                <br><br>

                <button type="submit">Apply</button>

            </fieldset>

        </form>

    </main>

    <footer>
        <p>© 2026 ABC College</p>
    </footer>

</body>
</html>
