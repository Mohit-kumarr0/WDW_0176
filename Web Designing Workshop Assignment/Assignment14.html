
<!DOCTYPE html>
<html>
<head>
    <title>Nested and Responsive Tables</title>

    <!-- This code creates a responsive table with nested tables for lab batches. The outer table displays the day, lab batches, faculty, room, and time. -->

    <style>
        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        table {
            border: 1px solid gray;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid gray;
            padding: 6px;
            text-align: center;
        }

        .nested-table {
            border-collapse: collapse;
        }

        .nested-table th,
        .nested-table td {
            padding: 5px;
        }
    </style>
</head>

<body>

    <div class="table-container">

        <table>

            <tr>
                <th>Day</th>
                <th>Lab Batches</th>
                <th>Faculty</th>
                <th>Room</th>
                <th>Time</th>
            </tr>

            <tr>

                <td>Friday</td>

                <td>
                    <table class="nested-table">

                        <tr>
                            <th>Batch</th>
                            <th>System</th>
                        </tr>

                        <tr>
                            <td>A1</td>
                            <td>PC 1-20</td>
                        </tr>

                        <tr>
                            <td>A2</td>
                            <td>PC 21-40</td>
                        </tr>

                    </table>
                </td>

                <td>Dr. Sharma</td>

                <td>Lab 2</td>

                <td>2-4 PM</td>

            </tr>

        </table>

    </div>

</body>
</html>
